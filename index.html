<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Camp District 3 en 1 — Administration</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">C3</div>
        <div>
          <strong>Camp District</strong>
          <span>Administration</span>
        </div>
      </div>

      <nav class="nav">
        <button class="nav-item active" data-view="dashboard"><span class="nav-icon">⌂</span> Tableau de bord</button>
        <button class="nav-item" data-view="participants"><span class="nav-icon">♙</span> Participants</button>
        <button class="nav-item" data-view="tickets"><span class="nav-icon">▣</span> Tickets</button>
        <button class="nav-item" data-view="news"><span class="nav-icon">▤</span> Fil d’actualité</button>
        <button class="nav-item" data-view="matches"><span class="nav-icon">⚽</span> Feuilles de match</button>
        <button class="nav-item" data-view="sponsors"><span class="nav-icon">✦</span> Sponsors</button>
        <button class="nav-item" data-view="partners"><span class="nav-icon">◇</span> Partenaires</button>
        <button class="nav-item" data-view="program"><span class="nav-icon">◷</span> Programme</button>
        <button class="nav-item" data-view="speakers"><span class="nav-icon">♟</span> Intervenants</button>
        <button class="nav-item" data-view="gallery"><span class="nav-icon">▧</span> Galerie</button>
        <button class="nav-item" data-view="notifications"><span class="nav-icon">♢</span> Notifications</button>
      </nav>

      <div class="sidebar-bottom">
        <button class="nav-item" data-view="settings"><span class="nav-icon">⚙</span> Paramètres</button>
        <button class="logout" id="logoutBtn"><span class="nav-icon">↪</span> Déconnexion</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="mobile-menu" id="mobileMenu" aria-label="Ouvrir le menu">☰</button>
        <div class="breadcrumb">
          <span>Administration</span>
          <b>/</b>
          <strong id="pageTitle">Tableau de bord</strong>
        </div>
        <div class="top-actions">
          <button class="icon-btn" title="Notifications">♢<i></i></button>
          <div class="admin-profile">
            <div class="avatar">A</div>
            <div>
              <strong>Administrateur</strong>
              <span>Super admin</span>
            </div>
          </div>
        </div>
      </header>

      <section class="content" id="content"></section>
    </main>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
